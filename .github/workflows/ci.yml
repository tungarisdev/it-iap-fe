name: Continuous Integration (CI)

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Existing UI code still has React Hooks lint debt. Keep the report visible
      # without allowing unrelated legacy findings to block deploys.
      - name: Lint source (advisory)
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        run: npm run build

      - name: Build frontend container
        run: docker build --tag itiap-fe:ci .
